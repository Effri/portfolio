    <title>effri — сайты, макеты и цифровые продукты</title>
    <script>
      // Применяем сохранённый выбор до первого отображения страницы.
      try {
        const readCookie = name => {
          const item = document.cookie.split('; ').find(value => value.startsWith(name + '='));
          return item ? decodeURIComponent(item.slice(name.length + 1)) : null;
        };
        const consent = JSON.parse(readCookie('portfolio_consent'));
        if (consent?.version === 1 && consent.preferences && readCookie('portfolio_theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f3f0e8';
          document.querySelector('meta[name="color-scheme"]').content = 'light';
        }
      } catch {}
    </script>
